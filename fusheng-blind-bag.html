<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#281d13">
  <title>浮生 x 好好吃饭联名盲袋｜CHENZHEYUAN</title>
  <style>
    :root {
      --night: #241a12;
      --brown: #48321d;
      --gold: #d4aa52;
      --gold-bright: #f3d47b;
      --cream: #f8e6ae;
      --muted: #c7a967;
      --serif: "Songti SC", "STSong", "Times New Roman", serif;
      --sans: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--cream);
      background: #17110c;
      font-family: var(--sans);
    }
    .page {
      width: min(100%, 920px);
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 24%, rgba(214, 172, 79, .12), transparent 27%),
        linear-gradient(180deg, #231912 0%, #342319 46%, #21170f 100%);
      box-shadow: 0 0 50px rgba(0, 0, 0, .45);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 24px;
      border-bottom: 1px solid rgba(212, 170, 82, .34);
      background: rgba(36, 26, 18, .9);
      backdrop-filter: blur(8px);
    }
    .brand, .back-link {
      color: var(--gold-bright);
      text-decoration: none;
    }
    .brand {
      font-family: var(--serif);
      font-size: 14px;
      letter-spacing: 3px;
    }
    .back-link {
      padding: 6px 12px;
      border: 1px solid rgba(243, 212, 123, .7);
      font-size: 12px;
      letter-spacing: 1px;
    }
    .hero {
      padding: 38px 24px 58px;
      text-align: center;
      background: linear-gradient(180deg, rgba(36, 26, 18, .82), rgba(36, 26, 18, .18));
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 4px;
    }
    h1 {
      margin: 0;
      color: var(--gold-bright);
      font-family: var(--serif);
      font-size: clamp(25px, 5vw, 46px);
      font-weight: 500;
      letter-spacing: 5px;
      line-height: 1.35;
    }
    h1 span {
      display: block;
      margin-top: 5px;
      color: var(--cream);
      font-size: .45em;
      letter-spacing: 4px;
    }
    .hero-copy {
      max-width: 490px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
    }
    .catalog-shell {
      padding: 0 24px 70px;
    }
    .progress-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: min(100%, 720px);
      margin: 0 auto 34px;
      border: 1px solid rgba(212, 170, 82, .35);
      background: rgba(31, 22, 14, .62);
    }
    .progress-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      width: min(100%, 720px);
      margin: -18px auto 31px;
      color: var(--muted);
      font-size: 12px;
    }
    .progress-controls input,
    .settings-row input {
      width: 90px;
      min-height: 36px;
      padding: 0 9px;
      border: 1px solid rgba(212, 170, 82, .42);
      border-radius: 2px;
      background: rgba(44, 30, 18, .86);
      color: var(--cream);
      font: inherit;
      text-align: center;
    }
    .control-hint { color: #967844; font-size: 10px; }
    .metric {
      min-width: 0;
      padding: 16px 10px 15px;
      text-align: center;
    }
    .metric + .metric { border-left: 1px solid rgba(212, 170, 82, .25); }
    .metric strong {
      display: block;
      color: var(--gold-bright);
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 500;
      line-height: 1.1;
    }
    .metric span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
    }
    .catalog-heading {
      margin: 0 auto 22px;
      color: var(--gold-bright);
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 500;
      letter-spacing: 4px;
      text-align: center;
    }
    .catalog-heading::before,
    .catalog-heading::after {
      content: "✦";
      margin: 0 13px;
      color: var(--gold);
      font-size: 13px;
      vertical-align: 3px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px 160px auto;
      gap: 8px;
      width: min(100%, 820px);
      margin: 0 auto 18px;
    }
    .toolbar input,
    .toolbar select,
    .toolbar button {
      min-height: 42px;
      min-width: 0;
      padding: 0 12px;
      border: 1px solid rgba(212, 170, 82, .38);
      border-radius: 2px;
      background: rgba(44, 30, 18, .86);
      color: var(--cream);
      font: inherit;
      font-size: 12px;
    }
    .toolbar input::placeholder { color: #a78b58; }
    .toolbar button { cursor: pointer; }
    .toolbar button:hover,
    .toolbar input:focus,
    .toolbar select:focus { border-color: var(--gold-bright); outline: none; }
    .catalog-meta {
      width: min(100%, 820px);
      margin: 0 auto 13px;
      color: #a98b56;
      font-size: 11px;
      text-align: right;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 13px;
      width: min(100%, 820px);
      margin: 0 auto;
    }
    .card-item {
      position: relative;
      min-width: 0;
      padding: 7px 7px 9px;
      border: 1px solid rgba(212, 170, 82, .35);
      background: rgba(57, 39, 23, .86);
      box-shadow: 0 5px 15px rgba(0, 0, 0, .18);
    }
    .card-item.is-collected { border-color: rgba(243, 212, 123, .9); }
    .card-cover {
      display: block;
      width: 100%;
      aspect-ratio: 8 / 13;
      overflow: hidden;
      border: 1px solid rgba(243, 212, 123, .25);
      background: #6c5030;
      cursor: zoom-in;
    }
    .card-cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-set {
      display: block;
      margin-top: 8px;
      color: var(--gold);
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .card-title {
      overflow: hidden;
      margin: 3px 0 7px;
      color: var(--cream);
      font-family: var(--serif);
      font-size: 13px;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-status {
      display: block;
      width: 100%;
      min-height: 30px;
      padding: 0 4px;
      border: 1px solid rgba(212, 170, 82, .45);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
    }
    .card-status:hover { border-color: var(--gold-bright); color: var(--gold-bright); }
    .empty-state {
      grid-column: 1 / -1;
      padding: 45px 20px;
      border: 1px dashed rgba(212, 170, 82, .4);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .card-grid { display: block; }
    .set-section {
      padding: 26px 0 30px;
      border-top: 1px solid rgba(212, 170, 82, .32);
    }
    .set-section:first-child { border-top: 0; }
    .set-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    .set-index {
      display: block;
      margin-bottom: 4px;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
    }
    .set-title {
      margin: 0;
      color: var(--gold-bright);
      font-family: var(--serif);
      font-size: 23px;
      font-weight: 500;
      letter-spacing: 3px;
    }
    .set-summary {
      max-width: 410px;
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }
    .set-status {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(212, 170, 82, .48);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
    }
    .set-status:hover,
    .set-section.is-collected .set-status { border-color: var(--gold-bright); color: var(--gold-bright); }
    .asset-group + .asset-group { margin-top: 26px; }
    .asset-group-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 10px;
      color: var(--cream);
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 2px;
    }
    .asset-group-title::before { content: "✦"; color: var(--gold); font-size: 11px; }
    .gift-status {
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      padding: 0 8px;
      border: 1px solid rgba(212, 170, 82, .42);
      color: var(--muted);
      font-family: var(--sans);
      font-size: 10px;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .gift-status.is-achieved { border-color: var(--gold-bright); color: var(--gold-bright); }
    .asset-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      gap: 10px;
    }
    .asset-group--five .asset-grid {
      max-width: 482px;
      margin-right: auto;
      margin-left: auto;
    }
    .gift-gallery {
      width: min(100%, 820px);
      margin: 0 auto;
    }
    .gift-group + .gift-group { margin-top: 29px; }
    .gift-group-title {
      margin: 0 0 11px;
      color: var(--cream);
      font-family: var(--serif);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1px;
      text-align: center;
    }
    .gift-asset-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: center;
      gap: 18px;
    }
    .gift-asset {
      position: relative;
      flex: 0 1 330px;
      max-width: 100%;
    }
    .gift-asset img {
      display: block;
      width: 100%;
      height: auto;
    }
    .gift-original-status {
      position: absolute;
      top: 9px;
      right: 9px;
      display: inline-flex;
      min-height: 25px;
      align-items: center;
      padding: 0 9px;
      border: 1px solid rgba(243, 212, 123, .8);
      background: rgba(44, 30, 18, .86);
      color: var(--cream);
      font-size: 10px;
      white-space: nowrap;
    }
    .gift-original-status.is-achieved { color: var(--gold-bright); }
    .asset-card {
      flex: 0 0 154px;
      width: 154px;
      height: 250px;
      position: relative;
      padding: 6px;
      border: 1px solid rgba(212, 170, 82, .3);
      background: rgba(57, 39, 23, .78);
      color: var(--cream);
      cursor: default;
      text-align: left;
    }
    .asset-card.trackable:not(.is-collected) {
      border-style: dashed;
      border-color: rgba(243, 212, 123, .68);
    }
    .asset-card:hover { border-color: var(--gold-bright); }
    .asset-card img {
      display: block;
      width: 100%;
      height: 188px;
      object-fit: contain;
      background: #6c5030;
      border: 1px solid rgba(243, 212, 123, .2);
    }
    .asset-card.tall { height: auto; }
    .asset-label {
      display: block;
      min-height: 30px;
      margin: 7px 2px 1px;
      color: var(--cream);
      font-size: 11px;
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .asset-code { display: block; margin: 0 2px; color: var(--gold); font-size: 9px; letter-spacing: 1px; }
    .asset-view {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: default;
      text-align: left;
    }
    .asset-card.trackable .asset-view { cursor: zoom-in; }
    .asset-status {
      position: absolute;
      top: 8px;
      right: 8px;
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(243, 212, 123, .9);
      border-radius: 50%;
      background: rgba(44, 30, 18, .7);
      color: var(--gold-bright);
      cursor: pointer;
      font: inherit;
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
    }
    .asset-status:hover { border-color: #fff0b0; }
    .set-section.is-collected { border-top-color: rgba(243, 212, 123, .72); }
    .set-section.is-collected .asset-card { border-color: rgba(243, 212, 123, .5); }
    .auto-status {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      padding: 0 11px;
      border: 1px solid rgba(212, 170, 82, .45);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    .auto-status.is-achieved { border-color: var(--gold-bright); color: var(--gold-bright); }
    .admin-settings {
      width: min(100%, 820px);
      margin: 20px auto 0;
      border-top: 1px solid rgba(212, 170, 82, .25);
      color: var(--muted);
      font-size: 11px;
    }
    .admin-settings summary { padding: 14px 0 9px; cursor: pointer; color: var(--gold); }
    .settings-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 4px 0 8px; }
    .settings-row button { min-height: 36px; padding: 0 13px; border: 1px solid rgba(212, 170, 82, .5); background: transparent; color: var(--cream); cursor: pointer; font: inherit; font-size: 11px; }
    .settings-row button:hover { border-color: var(--gold-bright); color: var(--gold-bright); }
    .admin-settings p { margin: 0 0 5px; color: #967844; line-height: 1.7; }
    .catalog-note {
      width: min(100%, 820px);
      margin: 28px auto 0;
      padding: 14px 16px;
      border-left: 2px solid var(--gold);
      background: rgba(50, 34, 20, .7);
      color: #bd9d60;
      font-size: 11px;
      line-height: 1.8;
    }
    dialog {
      width: min(92vw, 420px);
      padding: 0;
      border: 1px solid rgba(243, 212, 123, .65);
      background: #2b1e13;
      color: var(--cream);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .6);
    }
    dialog::backdrop { background: rgba(10, 7, 4, .76); }
    .dialog-body { padding: 18px; }
    .dialog-image {
      display: block;
      width: min(100%, 230px);
      aspect-ratio: 8 / 13;
      object-fit: cover;
      margin: 0 auto 16px;
      border: 1px solid rgba(243, 212, 123, .5);
    }
    .dialog-kicker { color: var(--gold); font-size: 10px; letter-spacing: 2px; }
    .dialog-title { margin: 5px 0 6px; color: var(--gold-bright); font-family: var(--serif); font-size: 21px; font-weight: 500; }
    .dialog-copy { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .dialog-actions { display: flex; gap: 8px; margin-top: 17px; }
    .dialog-actions button { flex: 1; min-height: 40px; border: 1px solid rgba(212, 170, 82, .5); background: transparent; color: var(--cream); cursor: pointer; font: inherit; font-size: 12px; }
    .dialog-actions button:hover { border-color: var(--gold-bright); color: var(--gold-bright); }
    .dialog-close { margin-left: auto; display: block; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; }
    footer {
      padding: 22px 20px 30px;
      border-top: 1px solid rgba(212, 170, 82, .28);
      color: #9a7941;
      font-size: 10px;
      letter-spacing: 1px;
      text-align: center;
    }
    @media (max-width: 760px) {
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar input { grid-column: 1 / -1; }
      .card-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .asset-grid { gap: 10px; }
    }
    @media (max-width: 560px) {
      header { padding: 13px 16px; }
      .brand { font-size: 11px; letter-spacing: 2px; }
      .back-link { padding: 5px 9px; font-size: 11px; }
      .hero { padding: 32px 17px 42px; }
      h1 { font-size: clamp(24px, 8vw, 34px); letter-spacing: 3px; }
      .hero-copy { font-size: 12px; }
      .catalog-shell { padding: 0 12px 48px; }
      .progress-panel { margin-bottom: 27px; }
      .metric strong { font-size: 21px; }
      .metric span { font-size: 9px; }
      .catalog-heading { font-size: 20px; letter-spacing: 2px; }
      .catalog-heading::before, .catalog-heading::after { margin: 0 5px; }
      .set-header { align-items: flex-start; flex-direction: column; gap: 10px; }
      .set-title { font-size: 20px; }
      .set-status { width: 100%; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .asset-grid { gap: 8px; }
      .asset-card { flex-basis: calc((100% - 8px) / 2); width: calc((100% - 8px) / 2); }
      .gift-asset-grid { gap: 12px; }
      .gift-asset { flex-basis: 100%; }
      .gift-original-status { top: 7px; right: 7px; min-height: 22px; padding: 0 6px; font-size: 9px; }
      .card-item { padding: 6px 6px 8px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <a class="brand" href="index.html">CHEN ZHEYUAN</a>
      <a class="back-link" href="index.html">返回主页</a>
    </header>
    <section class="hero">
      <p class="eyebrow">COLLABORATION · BLIND BAG</p>
      <h1>浮生 × 好好吃饭<span>联名盲袋</span></h1>
      <p class="hero-copy">浮生一梦，与你好好吃饭。把每一张小卡收进属于你的联名图鉴。</p>
    </section>
    <section class="catalog-shell" id="catalog">
      <div class="progress-panel" aria-label="收集进度">
        <div class="metric"><strong id="total-count">14</strong><span>可收集卡面</span></div>
        <div class="metric"><strong id="collected-count">0</strong><span>已收集</span></div>
        <div class="metric"><strong id="completion-rate">0%</strong><span>完成度</span></div>
      </div>
      <div class="progress-controls">
        <label for="purchased-bags">我已购买</label>
        <input id="purchased-bags" type="number" min="0" step="1" inputmode="numeric" value="0">
        <span>套盲袋</span>
        <span class="control-hint">个人满赠会自动解锁</span>
      </div>
      <h2 class="catalog-heading">浮生小卡图鉴</h2>
      <div class="toolbar" aria-label="图鉴筛选工具">
        <input id="search" type="search" placeholder="搜索套组、卡面名称或编号" aria-label="搜索套组、卡面名称或编号">
        <select id="set-filter" aria-label="筛选套组">
          <option value="all">全部套组</option>
          <option value="A">SET A · 浮生</option>
          <option value="B">SET B · 吃饭</option>
          <option value="personal">个人满赠</option>
          <option value="collective">集体加赠</option>
          <option value="special">特别分享</option>
        </select>
        <select id="status-filter" aria-label="筛选收集状态">
          <option value="all">全部状态</option>
          <option value="uncollected">未收集</option>
          <option value="collected">已收集</option>
        </select>
        <button id="reset-button" type="button">清除记录</button>
      </div>
      <p class="catalog-meta" id="visible-count">显示 5 个套组</p>
      <div class="card-grid" id="card-grid"></div>
      <details class="admin-settings">
        <summary>编辑集体加赠进度</summary>
        <div class="settings-row">
          <label for="collective-sales">当前销量</label>
          <input id="collective-sales" type="number" min="0" step="1" inputmode="numeric" value="0">
          <span>套</span>
          <button id="save-collective" type="button">保存</button>
        </div>
        <p>达到 520、1029、2029 套后，集体加赠会自动显示“已达成”。</p>
      </details>
      <p class="catalog-note" id="notes">卡面由活动方案图中对应区域单独截取，页面只展示卡面内容。点击套组右侧状态，可以记录自己的收集进度。</p>
    </section>
    <dialog id="card-dialog" aria-labelledby="dialog-title">
      <div class="dialog-body">
        <button class="dialog-close" id="dialog-close" type="button" aria-label="关闭卡片详情">×</button>
        <img class="dialog-image" id="dialog-image" src="" alt="">
        <span class="dialog-kicker" id="dialog-kicker"></span>
        <h2 class="dialog-title" id="dialog-title"></h2>
        <p class="dialog-copy" id="dialog-copy"></p>
        <div class="dialog-actions">
          <button type="button" data-dialog-action="collect">增加 1 张</button>
          <button type="button" data-dialog-action="clear">清除记录</button>
        </div>
      </div>
    </dialog>
    <footer>© 2026 远宇宙米饭制造厂 · 陈哲远生日应援企划</footer>
  </main>
  <script>/* Previous single-card prototype kept below for reference.
    const cards = [
      { id: "A01", set: "A", setName: "SET A · 浮生", title: "浮生小卡 01", image: "assets/fusheng-card-a01.jpg" },
      { id: "A02", set: "A", setName: "SET A · 浮生", title: "浮生小卡 02", image: "assets/fusheng-card-a02.jpg" },

  <script>
    const sets = [
      {

        groups: [

            ["B-S03", "小卡 03", "assets/fusheng-b-small-03.jpg"], ["B-S04", "小卡 04", "assets/fusheng-b-small-04.jpg"],

          ]},
          { title: "高仿真拍立得 · 2 款", className: "asset-group--instax", items: [

          ]}
        ]
      },
      {

        summary: "下单首袋累计计算，随订单发出。每个下单账号单独计算。",
        groups: [

          { title: "累计 10 包 · 浮生滴胶冰箱贴 ×4", threshold: 10, className: "asset-group--single", items: [["P10-S", "浮生滴胶冰箱贴 ×4", "assets/fusheng-personal-stickers.jpg"]] }

      },

        groups: [

    const collectiveDefaultSales = 0; // 发布前把这里改成最新集体销量
    const grid = document.getElementById("card-grid");
    const search = document.getElementById("search");
    const setFilter = document.getElementById("set-filter");
    const statusFilter = document.getElementById("status-filter");
    const visibleCount = document.getElementById("visible-count");
    const dialog = document.getElementById("card-dialog");
    const dialogImage = document.getElementById("dialog-image");
    const dialogKicker = document.getElementById("dialog-kicker");
    const dialogTitle = document.getElementById("dialog-title");
    const dialogCopy = document.getElementById("dialog-copy");
    const dialogActions = document.querySelector(".dialog-actions");
    const purchasedInput = document.getElementById("purchased-bags");
    const collectiveSalesInput = document.getElementById("collective-sales");
    const purchaseKey = "fusheng-blind-bag-purchased-v1";
    const collectiveSalesKey = "fusheng-blind-bag-collective-sales-v1";
    let collection = {};
    let activeSetId = null;
    let activeAssetId = null;
    let purchasedBags = Math.max(0, Number(localStorage.getItem(purchaseKey) || 0));
    let collectiveSales = Math.max(0, Number(localStorage.getItem(collectiveSalesKey) || collectiveDefaultSales));
    purchasedInput.value = purchasedBags;
    collectiveSalesInput.value = collectiveSales;
    try { collection = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch (error) { collection = {}; }

    function getQuantity(id) { return Number(collection[id] || 0); }
    function isSetCard(set) { return set.id === "A" || set.id === "B"; }
    function setItems(set) { return set.groups.flatMap(group => group.items); }
    function groupAchieved(set, group) {
      if (set.id === "personal") return purchasedBags >= group.threshold;
      if (set.id === "collective") return collectiveSales >= group.threshold;
      return false;
    }
    function setMatches(set) {
      const term = search.value.trim().toLowerCase();
      const setMatch = setFilter.value === "all" || setFilter.value === set.id;
      const text = [set.title, set.summary, ...setItems(set).flat()].join(" ").toLowerCase();
      const hasCollected = isSetCard(set) && setItems(set).some(item => getQuantity(item[0]) > 0);
      const hasUncollected = isSetCard(set) && setItems(set).some(item => getQuantity(item[0]) === 0);
      const giftStatuses = set.groups.filter(group => group.threshold).map(group => groupAchieved(set, group));
      const statusMatch = statusFilter.value === "all"
        || (statusFilter.value === "collected" && (hasCollected || giftStatuses.includes(true)))
        || (statusFilter.value === "uncollected" && (hasUncollected || giftStatuses.includes(false)));
      return setMatch && statusMatch && (!term || text.includes(term));
    }
    function saveCollection() {
      localStorage.setItem(storageKey, JSON.stringify(collection));
      render();
      updateMetrics();
    }
    function updateMetrics() {
      const collectibleItems = sets.filter(isSetCard).flatMap(setItems);
      const collected = collectibleItems.filter(item => getQuantity(item[0]) > 0).length;
      document.getElementById("total-count").textContent = collectibleItems.length;
      document.getElementById("collected-count").textContent = collected;
      document.getElementById("completion-rate").textContent = Math.round(collected / collectibleItems.length * 100) + "%";
      document.getElementById("notes").textContent = "SET A/B 的每张卡面独立记录数量；个人满赠和集体加赠根据门槛自动显示状态。卡面均由方案图中的对应区域单独截取。";
    }
    function renderAsset(set, item) {
      const [id, label, image] = item;
      const quantity = getQuantity(id);
      const trackable = isSetCard(set);
      const viewStart = trackable
        ? `<button class="asset-view" type="button" data-open-asset="${id}" data-set-id="${set.id}" aria-label="查看 ${label}">`
        : `<div class="asset-view">`;
      const viewEnd = trackable ? "</button>" : "</div>";
      const status = trackable && quantity ? `<button class="asset-status" type="button" data-asset-cycle="${id}" aria-label="已收集 ${quantity} 张，点击增加数量">${quantity}</button>` : "";
      return `<article class="asset-card ${trackable ? "trackable" : ""} ${quantity ? "is-collected" : ""}">
        ${viewStart}
          <img src="${image}" alt="${set.title} ${label}">
          <span class="asset-label">${label}</span>
          <span class="asset-code">${id}</span>
        ${viewEnd}${status}
      </article>`;
    }
    function isGiftSet(set) { return set.id === "personal" || set.id === "collective"; }
    function renderGiftOriginal(set) {
      return `<div class="gift-gallery">${set.groups.map(group => `<div class="gift-group">
        <h4 class="gift-group-title">${group.title}</h4>
        <div class="gift-asset-grid">${group.items.map(item => `<div class="gift-asset">
          <img src="${item[2]}" alt="${set.title} ${item[1]}">
          <span class="gift-original-status ${groupAchieved(set, group) ? "is-achieved" : ""}">${groupAchieved(set, group) ? "已达成" : "未达成"}</span>
        </div>`).join("")}</div>
      </div>`).join("")}</div>`;
    }
    function render() {
      const visibleSets = sets.filter(setMatches);
      visibleCount.textContent = "显示 " + visibleSets.length + " 个套组";
      grid.innerHTML = visibleSets.length ? visibleSets.map(set => `<article class="set-section ${isSetCard(set) && setItems(set).every(item => getQuantity(item[0]) > 0) ? "is-collected" : ""}">
        <div class="set-header">
          <div><span class="set-index">PART ${set.number}</span><h3 class="set-title">${set.title}</h3><p class="set-summary">${set.summary}</p></div>
          ${isSetCard(set) ? '<span class="auto-status">卡面图鉴</span>' : set.id === "special" ? '<span class="auto-status">活动条件</span>' : ""}
        </div>
        ${isGiftSet(set) ? renderGiftOriginal(set) : set.groups.map(group => `<div class="asset-group ${group.className || ""}"><h4 class="asset-group-title">${group.title}${group.threshold ? `<span class="gift-status ${groupAchieved(set, group) ? "is-achieved" : ""}">${groupAchieved(set, group) ? "已达成" : "未达成"}</span>` : ""}</h4><div class="asset-grid">${group.items.map(item => renderAsset(set, item)).join("")}</div></div>`).join("")}
      </article>`).join("") : "<div class=\"empty-state\">没有找到符合条件的套组</div>";
    }
    function openAsset(assetId, setId) {
      const set = sets.find(item => item.id === setId);
      const item = set && setItems(set).find(candidate => candidate[0] === assetId);
      if (!set || !item) return;
      activeSetId = set.id;
      activeAssetId = assetId;
      const quantity = getQuantity(assetId);
      dialogImage.src = item[2];
      dialogImage.alt = item[1];
      dialogKicker.textContent = set.title + " · " + item[0];
      dialogTitle.textContent = item[1];
      dialogCopy.textContent = isSetCard(set) ? "当前收集数量：" + (quantity || 0) + " 张。" : "此项状态由活动门槛自动判断，不需要手动点击收集。";
      dialogActions.hidden = !isSetCard(set);
      if (typeof dialog.showModal === "function" && !dialog.open) dialog.showModal();
    }
    grid.addEventListener("click", event => {
      const asset = event.target.closest("[data-open-asset]");
      const cycle = event.target.closest("[data-asset-cycle]");
      if (asset) openAsset(asset.dataset.openAsset, asset.dataset.setId);
      if (cycle) { collection[cycle.dataset.assetCycle] = (getQuantity(cycle.dataset.assetCycle) + 1) % 4; saveCollection(); }
    });
    [search, setFilter, statusFilter].forEach(control => {
      control.addEventListener("input", render);
      control.addEventListener("change", render);
    });
    purchasedInput.addEventListener("input", () => {
      purchasedBags = Math.max(0, Number(purchasedInput.value || 0));
      localStorage.setItem(purchaseKey, String(purchasedBags));
      render();
    });
    document.getElementById("save-collective").addEventListener("click", () => {
      collectiveSales = Math.max(0, Number(collectiveSalesInput.value || 0));
      localStorage.setItem(collectiveSalesKey, String(collectiveSales));
      render();
    });
    document.getElementById("reset-button").addEventListener("click", () => { collection = {}; purchasedBags = 0; purchasedInput.value = 0; saveCollection(); });
    document.getElementById("dialog-close").addEventListener("click", () => dialog.close());

    dialog.querySelectorAll("[data-dialog-action]").forEach(button => button.addEventListener("click", () => {
      if (!activeAssetId || !activeSetId || !isSetCard(sets.find(set => set.id === activeSetId))) return;
      collection[activeAssetId] = button.dataset.dialogAction === "collect" ? getQuantity(activeAssetId) + 1 : 0;
      saveCollection();
      openAsset(activeAssetId, activeSetId);
    }));
    render();
    updateMetrics();
  </script>
